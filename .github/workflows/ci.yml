name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./cmd/... ./internal/... ./shortcuts/...

  # Everything that needs a built binary. Kept as its own job so it runs in
  # parallel with the matrix above rather than lengthening it.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Claude Code needs Node 22+; on 20, npm falls back to a release without
          # `plugin validate --profile`.
          node-version: '22'

      # ./tests/... is excluded from the unit-test job's package list, so without
      # this step the spec guards (shortcut paths / query keys) and the read-only
      # eval wrapper's safety test never run in CI.
      - name: Integration tests
        run: make integration-test

      # L0 drift sentinel: skills document commands/flags/schema-refs/body keys;
      # each one must exist in the binary built from THIS commit, so a CLI change
      # that orphans skill docs fails the PR here.
      - name: Skills drift lint (L0)
        run: make skills-lint

      # Plugin manifests: validate the Claude manifest against the directory's
      # checks, then install the plugin into Codex and Copilot from this
      # checkout, so a broken manifest fails the PR instead of a store review.
      - name: Plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code @openai/codex @github/copilot
          claude plugin validate --strict --profile directory .
          codex plugin marketplace add ./
          codex plugin add shoplazza@shoplazza-cli
          copilot plugin marketplace add "$PWD"
          copilot plugin install shoplazza@shoplazza-cli
