name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # The Codex plugin store takes uploads as a ZIP; attach one to every
      # release. The two maintenance folders under skills/ are not skills.
      - name: Upload Codex plugin ZIP
        run: |
          ZIP="shoplazza-plugin-${GITHUB_REF_NAME#v}.zip"
          zip -r "$ZIP" plugin.json skills assets README.md LICENSE -x 'skills/_template*' 'skills/shoplazza-skill-eval*'
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
